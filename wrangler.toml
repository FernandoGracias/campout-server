name = "campout-server"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
TURN_KEY_ID = "115b4afe9f6906020465cc46e027b1aa"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[ratelimits]]
name = "TURN_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "CREATE_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "JOIN_RATE_LIMITER"
namespace_id = "1003"

[ratelimits.simple]
limit = 20
period = 60
